faq:
  title: "Frequently asked questions"
  items:
    - q: "Do you only work with architects and interior designers?"
      a: "Yes. It is the only market we serve. That is why campaigns, forms and follow-up are built from day one for the sales cycle of a design project."
    - q: "How does the 90-day project work?"
      a: "Five phases, each with a deadline and a deliverable: survey, concept, technical design, construction and handover. At the end, we present the final report and the plan for the next 90 days."
    - q: "How much do I need to invest in ads?"
      a: "Media spend is paid directly to the platforms and set during the diagnostic, based on region and goal. [PREENCHER: minimum reference amount, e.g. from $300 per month]"
    - q: "When do the first inquiries come in?"
      a: "Campaigns go live at the end of the second week. Volume and quality depend on budget, region and offer. These numbers are projected in the diagnostic, never promised before it."
    - q: "Do you manage social media?"
      a: "No. Our work runs from the ad to the signed contract."
    - q: "Which countries do you work in, and in which language?"
      a: "[PREENCHER: countries and service language]"
    - q: "How are you different from a generalist agency?"
      a: "A generalist agency learns your market with your money. We only serve architecture and interiors: high-value projects, slow decisions, clients who compare portfolios. Everything is designed for that cycle."
    - q: "What stays with the studio if we do not renew?"
      a: "[PREENCHER: what stays in the client's name, e.g. ad accounts, pixel, pages, CRM, creative]"

