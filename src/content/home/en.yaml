services:
  title: "Services"
  lead: "Six fronts, worked together. Ads without a sales process only produce lost inquiries."
  deliverables_label: "Deliverables"
  items:
    - number: "01"
      name: "Sales strategy"
      summary: "Before any ad goes live, we define who to sell to, what to sell and at what price."
      drawing: strategy
      deliverables:
        - "Studio and market diagnostic"
        - "Ideal client and target project value"
        - "Offer and positioning"
        - "Goals and KPIs for the 90 days"
    - number: "02"
      name: "Paid media"
      summary: "Meta and Google campaigns built to bring in quote requests, not followers."
      drawing: ads
      deliverables:
        - "Campaign structure"
        - "Creative and copy"
        - "Targeting by profile and region"
        - "Weekly testing and optimization"
    - number: "03"
      name: "Funnels and landing pages"
      summary: "The path between the ad and the conversation, designed to filter out the curious."
      drawing: funnel
      deliverables:
        - "Landing pages"
        - "Qualifying forms with conditional logic"
        - "WhatsApp integration"
        - "Retargeting"
    - number: "04"
      name: "CRM and sales process"
      summary: "Every lead with an owner, a deadline and a next step."
      drawing: crm
      deliverables:
        - "CRM setup"
        - "Stage-based sales pipeline"
        - "Follow-up cadence"
        - "Scripts for WhatsApp and the diagnostic call"
        - "Training for whoever handles inquiries"
    - number: "05"
      name: "SEO and Google presence"
      summary: "Show up on Google when someone searches for architecture or interior design in your city."
      drawing: seo
      deliverables:
        - "Local SEO and Google Business Profile"
        - "Pages by service and region"
        - "Content for high-intent searches"
        - "Rank tracking"
    - number: "06"
      name: "Data and reporting"
      summary: "Know where every contract came from."
      drawing: data
      deliverables:
        - "Pixel, Conversions API, GA4 and Tag Manager"
        - "Source tracking for every lead"
        - "Weekly dashboard"
        - "Monthly review with recommendations"

