services:
  title: "Servicios"
  lead: "Seis frentes trabajados a la vez. Anunciarse sin proceso comercial solo genera solicitudes perdidas."
  deliverables_label: "Entregables"
  items:
    - number: "01"
      name: "Estrategia comercial"
      summary: "Antes de anunciar, definimos a quién vender, qué vender y a qué precio."
      drawing: strategy
      deliverables:
        - "Diagnóstico del estudio y del mercado"
        - "Cliente ideal y ticket objetivo"
        - "Oferta y posicionamiento"
        - "Metas e indicadores de los 90 días"
    - number: "02"
      name: "Publicidad de pago"
      summary: "Campañas en Meta y Google para generar solicitudes de presupuesto, no seguidores."
      drawing: ads
      deliverables:
        - "Estructura de campañas"
        - "Creatividades y textos"
        - "Segmentación por perfil y zona"
        - "Pruebas y optimización semanal"
    - number: "03"
      name: "Embudos y páginas de conversión"
      summary: "El camino entre el anuncio y la conversación, diseñado para filtrar a los curiosos."
      drawing: funnel
      deliverables:
        - "Landing pages"
        - "Formularios con cualificación y lógica condicional"
        - "Integración con WhatsApp"
        - "Remarketing"
    - number: "04"
      name: "CRM y proceso comercial"
      summary: "Cada lead con responsable, plazo y siguiente paso."
      drawing: crm
      deliverables:
        - "Implantación del CRM"
        - "Embudo de ventas por etapas"
        - "Cadencia de seguimiento"
        - "Guiones de WhatsApp y de la llamada de diagnóstico"
        - "Formación de quien atiende las solicitudes"
    - number: "05"
      name: "SEO y presencia en Google"
      summary: "Aparecer en Google cuando alguien busca arquitectura o interiorismo en tu ciudad."
      drawing: seo
      deliverables:
        - "SEO local y Perfil de Empresa en Google"
        - "Páginas por servicio y zona"
        - "Contenido para búsquedas con intención de compra"
        - "Seguimiento de posiciones"
    - number: "06"
      name: "Datos e informes"
      summary: "Saber de dónde vino cada contrato."
      drawing: data
      deliverables:
        - "Píxel, API de Conversiones, GA4 y Tag Manager"
        - "Origen de cada lead rastreado"
        - "Dashboard semanal"
        - "Lectura mensual con recomendaciones"

