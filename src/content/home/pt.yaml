# F.02
services:
  title: "Serviços"
  lead: "Seis frentes trabalhadas em conjunto. Anúncio sem processo comercial só gera pedido perdido."
  deliverables_label: "Entregas"
  items:
    - number: "01"
      name: "Estratégia comercial"
      summary: "Antes de anunciar, definimos a quem vender, o que vender e por quanto."
      drawing: strategy
      deliverables:
        - "Diagnóstico do atelier e do mercado"
        - "Cliente ideal e ticket-alvo"
        - "Oferta e posicionamento"
        - "Metas e indicadores dos 90 dias"
    - number: "02"
      name: "Tráfego pago"
      summary: "Campanhas no Meta e no Google para gerar pedidos de orçamento, não seguidores."
      drawing: ads
      deliverables:
        - "Estrutura de campanhas"
        - "Criativos e textos"
        - "Segmentação por perfil e região"
        - "Testes e otimização semanal"
    - number: "03"
      name: "Funis e páginas de conversão"
      summary: "O caminho entre o anúncio e a conversa, desenhado para filtrar curiosos."
      drawing: funnel
      deliverables:
        - "Landing pages"
        - "Formulários com qualificação e lógica condicional"
        - "Integração com o WhatsApp"
        - "Remarketing"
    - number: "04"
      name: "CRM e processo comercial"
      summary: "Cada lead com dono, prazo e próximo passo."
      drawing: crm
      deliverables:
        - "Implementação do CRM"
        - "Funil de vendas por etapas"
        - "Cadência de follow-up"
        - "Roteiros de WhatsApp e da chamada de diagnóstico"
        - "Capacitação de quem faz o atendimento"
    - number: "05"
      name: "SEO e presença no Google"
      summary: "Estar no Google quando alguém procura arquitetura ou interiores na sua cidade."
      drawing: seo
      deliverables:
        - "SEO local e Perfil da Empresa no Google"
        - "Páginas por serviço e região"
        - "Conteúdo para pesquisas com intenção de compra"
        - "Acompanhamento de posições"
    - number: "06"
      name: "Dados e relatórios"
      summary: "Saber de onde veio cada contrato."
      drawing: data
      deliverables:
        - "Pixel, API de Conversões, GA4 e Tag Manager"
        - "Origem de cada lead rastreada"
        - "Dashboard semanal"
        - "Leitura mensal com recomendações"

# F.03 (prazos das fases em proposta: validar antes de publicar)
project:
  title: "Projeto de 90 dias"
  lead: "Início, fim e entregas definidos. Como qualquer obra séria."
  phase_label: "Fase"
  deliverable_label: "Entrega"
  days: "Dias {from} a {to}"
  axis_unit: "dias"
  phases:
    - number: "01"
      name: "Levantamento"
      from: 1
      to: 4
      body: "Acessos, auditoria das contas de anúncio, do site e do Instagram, leitura do processo comercial atual, concorrência e números do atelier."
      deliverable: "Relatório de diagnóstico."
    - number: "02"
      name: "Anteprojeto"
      from: 5
      to: 8
      body: "Cliente ideal, oferta, plano de mídia, desenho do funil e metas."
      deliverable: "Plano dos 90 dias aprovado pelo atelier."
    - number: "03"
      name: "Execução"
      from: 9
      to: 14
      body: "Tracking, CRM, páginas, formulários, criativos e campanhas montadas."
      deliverable: "Estrutura completa pronta para ir ao ar."
    - number: "04"
      name: "Obra"
      from: 15
      to: 75
      body: "Campanhas no ar, testes de criativo e público, otimização semanal e acompanhamento do atendimento comercial."
      deliverable: "Relatório semanal e ajustes contínuos."
    - number: "05"
      name: "Entrega"
      from: 76
      to: 90
      body: "Escala do que funcionou, consolidação do processo e leitura final dos números."
      deliverable: "Relatório final e plano dos próximos 90 dias."
  # [confirmar] se todos os itens entram no projeto
  specs:
    label: "Memória descritiva"
    title: "O que o atelier recebe"
    items:
      - "Diagnóstico documentado do atelier e do mercado"
      - "Plano de mídia e metas dos 90 dias"
      - "Campanhas ativas no Meta e, quando fizer sentido, no Google"
      - "Páginas e formulários de captação"
      - "CRM configurado com funil e cadência de follow-up"
      - "Roteiros de atendimento para WhatsApp e diagnóstico"
      - "Tracking completo e dashboard semanal"
      - "Relatório final com o plano dos 90 dias seguintes"

