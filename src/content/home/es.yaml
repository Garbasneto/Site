faq:
  title: "Preguntas frecuentes"
  items:
    - q: "¿Trabajáis solo con arquitectos e interioristas?"
      a: "Sí. Es el único mercado que atendemos. Por eso la campaña, el formulario y el seguimiento nacen pensados para el ciclo de venta de un proyecto."
    - q: "¿Cómo funciona el proyecto de 90 días?"
      a: "Son cinco fases con plazo y entregable definidos: levantamiento, anteproyecto, proyecto de ejecución, obra y entrega. Al final, presentamos el informe final y el plan de los 90 días siguientes."
    - q: "¿Cuánto tengo que invertir en anuncios?"
      a: "El presupuesto de medios se paga directamente a las plataformas y se define en el diagnóstico, según la zona y la meta. [PREENCHER: importe mínimo de referencia, p. ej. desde 300 € al mes en Europa]"
    - q: "¿Cuándo llegan las primeras solicitudes?"
      a: "Las campañas salen al final de la segunda semana. El volumen y la calidad dependen del presupuesto, la zona y la oferta. Esos números se proyectan en el diagnóstico, nunca se prometen antes."
    - q: "¿Gestionáis redes sociales?"
      a: "No. Nuestro trabajo va del anuncio al contrato firmado."
    - q: "¿En qué países y en qué idioma trabajáis?"
      a: "[PREENCHER: países e idioma de atención]"
    - q: "¿En qué os diferenciáis de una agencia generalista?"
      a: "Una agencia generalista aprende tu mercado con tu dinero. Nosotros solo atendemos arquitectura e interiorismo: ticket alto, decisión lenta, cliente que compara portfolios. Todo está diseñado para ese ciclo."
    - q: "¿Qué se queda el estudio si no renueva?"
      a: "[PREENCHER: lo que queda a nombre del cliente, p. ej. cuentas publicitarias, píxel, páginas, CRM, creatividades]"

