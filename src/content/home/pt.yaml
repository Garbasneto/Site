# F.07
faq:
  title: "Perguntas frequentes"
  items:
    - q: "Trabalham só com arquitetos e designers de interiores?"
      a: "Sim. É o único mercado que atendemos. Por isso campanha, formulário e follow-up já nascem pensados para o ciclo de venda de um projeto."
    - q: "Como funciona o projeto de 90 dias?"
      a: "São cinco fases com prazo e entrega definidos: levantamento, anteprojeto, execução, obra e entrega. No fim, apresentamos o relatório final e o plano dos 90 dias seguintes."
    - q: "Quanto preciso investir em anúncios?"
      a: "A verba de mídia é paga diretamente às plataformas e definida no diagnóstico, conforme a região e a meta. [PREENCHER: valor mínimo de referência, ex.: a partir de €300 por mês na Europa]"
    # [validar] junto com os prazos das fases
    - q: "Quando aparecem os primeiros pedidos?"
      a: "As campanhas entram no ar ao fim da segunda semana. Volume e qualidade dependem de verba, região e oferta. Esses números são projetados no diagnóstico, nunca prometidos antes dele."
    - q: "Fazem gestão de redes sociais?"
      a: "Não. O nosso trabalho vai do anúncio ao contrato assinado."
    - q: "Em que países e em que idioma atendem?"
      a: "[PREENCHER: países e idioma do atendimento]"
    - q: "Qual é a diferença para uma agência generalista?"
      a: "Uma agência generalista aprende o seu mercado com o seu dinheiro. Nós só atendemos arquitetura e interiores: ticket alto, decisão lenta, cliente que compara portfólio. Tudo é desenhado para esse ciclo."
    - q: "O que fica com o atelier se não houver renovação?"
      a: "[PREENCHER: o que fica em nome do cliente, ex.: contas de anúncio, pixel, páginas, CRM, criativos]"

